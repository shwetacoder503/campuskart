<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusKart | Your campus marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">CK</span> CampusKart</a>
      <nav class="nav-links">
        <a href="index.html">Browse</a>
        <a href="my-listings.html">My listings</a>
        <a href="messages.html">Messages</a>
      </nav>
      <div>
        <div id="navAuth" class="nav-actions"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <span class="badge">College email verified</span>
        <h1>Your campus,<br />one <span class="hl">marketplace</span></h1>
        <p>Calculators, books, lab gear and hostel stuff from students you can meet in person.</p>
        <form id="searchForm" class="search">
          <input id="searchInput" type="search" placeholder='Try "scientific calculator"' maxlength="100" />
          <button class="btn btn-brand" type="submit">Search</button>
        </form>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-card art-a"><div class="pic" id="heroPicA"></div><div class="txt">Calculators</div><span class="tag-lime">Sell yours</span></div>
        <div class="art-card art-b"><div class="pic" id="heroPicB"></div><div class="txt">Books</div><span class="tag-lime">Sell yours</span></div>
      </div>
    </section>

    <div id="chips" class="chips"></div>

    <h2 class="section-title">Fresh on campus</h2>
    <div id="status" class="msg" hidden></div>
    <div id="grid" class="grid"></div>
    <div class="center"><button id="loadMore" class="btn btn-ghost" hidden>Load more</button></div>
  </main>

<!--<footer>CampusKart, a final-year project</footer>-->

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
