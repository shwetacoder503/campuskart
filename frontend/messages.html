<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages | CampusKart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">CK</span> CampusKart</a>
      <nav class="nav-links">
        <a href="index.html">Browse</a>
        <a href="my-listings.html">My listings</a>
        <a href="messages.html">Messages</a>
      </nav>
      <div id="navAuth" class="nav-actions"></div>
    </div>
  </header>

  <main class="container">
    <div class="page-head"><h1>Messages</h1></div>

    <div class="tabs">
      <button class="tab active" data-role="" type="button">All</button>
      <button class="tab" data-role="BUYING" type="button">Buying</button>
      <button class="tab" data-role="SELLING" type="button">Selling</button>
    </div>

    <p id="loading" class="msg">Loading...</p>
    <div id="list"></div>
    <div id="empty" class="msg" hidden>No conversations yet. Open an item and choose "Message seller" to start one.</div>
    <div class="center"><button id="loadMore" class="btn btn-ghost" hidden>Load more</button></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
