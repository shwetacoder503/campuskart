<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in | CampusKart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">CK</span> CampusKart</a>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in with your college email.</p>

      <div id="msg" class="form-msg" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">College email</label>
          <input id="email" type="email" placeholder="2024bcs503@sggs.ac.in" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button id="submitBtn" class="btn btn-brand btn-block" type="submit">Log in</button>
      </form>

      <p id="resendBox" class="auth-alt" hidden>
        Didn't get the verification email? <button id="resendBtn" class="linkbtn" type="button">Resend verification link</button>
      </p>
      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
